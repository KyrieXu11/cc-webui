<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5b6bff; } a:hover { color: #6e7cff; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; display: flex; flex-direction: column; background: #0a0d14; color: #e8eaed; font-family: 'IBM Plex Sans', -apple-system, 'PingFang SC', sans-serif; overflow: hidden;">

  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-bottom: 1px solid rgba(255,255,255,0.06);">
    <div onClick="{{ openSessions }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #a0a4ad; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1;">
      <div style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">cc-webui</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6b7079; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">~/code/cc-webui</div>
    </div>
    <div onClick="{{ openFiles }}" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #a0a4ad; cursor: pointer;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M3 5.5A1.5 1.5 0 0 1 4.5 4h3L9 6h4.5A1.5 1.5 0 0 1 15 7.5v6A1.5 1.5 0 0 1 13.5 15h-9A1.5 1.5 0 0 1 3 13.5z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #a0a4ad;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="4" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="14" cy="9" r="1.4" fill="currentColor"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 18px;">
    <div style="align-self: flex-end; max-width: 84%; background: #191e2a; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; line-height: 1.6;">把 scan 改成只遍历白名单里的目录</div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 14.5px; line-height: 1.65;">先看现在的实现——它是走完整个 <span style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:#ef9d5a;">$HOME</span> 再过滤。内容区比方案 A 高 64px，一屏能多放一轮对话。</div>
      <div style="border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden;">
        <div style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #121620;">
          <div style="width: 6px; height: 6px; border-radius: 999px; background: #3ecf8e;"></div>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a0a4ad;">Read</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #6b7079; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">server/fs.ts</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7079;">0.2s</span>
        </div>
        <div style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-top: 1px solid rgba(255,255,255,0.06);">
          <div style="width: 6px; height: 6px; border-radius: 999px; background: #e0a030;"></div>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a0a4ad;">Bash</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #6b7079; flex-grow: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">npm test</span>
          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7079;">运行中</span>
        </div>
      </div>
      <div style="font-size: 14.5px; line-height: 1.65;">任务面板和管理页在右上角「⋯」里，不占常驻空间。</div>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 8px 12px 28px;">
    <div style="background: #191e2a; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;">
      <div style="padding: 12px 14px 6px; font-size: 14.5px; line-height: 1.6; color: #6b7079;">问点什么…</div>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px;">
        <div style="display: flex; gap: 2px; align-items: center;">
          <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #a0a4ad;">
            <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M12.5 8.5L9 12a2.5 2.5 0 0 1-3.5-3.5l4-4a1.7 1.7 0 0 1 2.4 2.4L8 10.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          </div>
          <div style="height: 44px; display: flex; align-items: center; padding: 0 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #6b7079;">opus · auto</div>
        </div>
        <div style="width: 44px; height: 44px; border-radius: 999px; background: #5b6bff; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- 抽屉：点左上汉堡 / 右上文件夹试试 -->
  <sc-if value="{{ drawerOpen }}" hint-placeholder-val="{{ true }}">
    <div onClick="{{ close }}" style="position: absolute; inset: 0; background: rgba(0,0,0,0.55); cursor: pointer;"></div>
    <div style="position: absolute; top: 0; bottom: 0; {{ drawerSide }}: 0; width: 320px; background: #0a0d14; border-right: 1px solid rgba(255,255,255,0.12); display: flex; flex-direction: column;">
      <div style="padding: 16px 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.06);">
        <div style="font-size: 14px; font-weight: 600;">{{ drawerTitle }}</div>
        <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7079; margin-top: 2px;">~/code/cc-webui</div>
      </div>
      <div style="flex-grow: 1; overflow-y: auto; padding: 6px 0;">
        <sc-for list="{{ drawerRows }}" as="r" hint-placeholder-count="6">
          <div style="min-height: 52px; display: flex; flex-direction: column; justify-content: center; gap: 3px; padding: 6px 16px; border-left: 2px solid {{ r.mark }};">
            <div style="font-size: 13px; color: #e8eaed; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ r.title }}</div>
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6b7079;">{{ r.meta }}</div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { drawer: null };
  }
  renderVals() {
    const d = this.state.drawer;
    const sessions = [
      { title: "把 scan 改成只遍历白名单", meta: "刚刚 · 12 条", mark: "#5b6bff" },
      { title: "AskUserQuestion 渲染修复", meta: "1 小时前 · 34 条", mark: "transparent" },
      { title: "工作区落地", meta: "3 小时前 · 51 条", mark: "transparent" },
      { title: "移动端适配调研", meta: "昨天 · 8 条", mark: "transparent" },
      { title: "frpc + nginx 上线", meta: "昨天 · 22 条", mark: "transparent" },
      { title: "SQLite 迁移", meta: "前天 · 40 条", mark: "transparent" },
    ];
    const files = [
      { title: "auth/", meta: "目录 · 9 个文件", mark: "transparent" },
      { title: "executors/", meta: "目录 · 3 个文件", mark: "transparent" },
      { title: "chat.ts", meta: "36 KB · 10 分钟前", mark: "transparent" },
      { title: "fs.ts", meta: "9 KB · 刚刚", mark: "#5b6bff" },
      { title: "permission.ts", meta: "5 KB · 20 分钟前", mark: "transparent" },
      { title: "index.ts", meta: "3 KB · 昨天", mark: "transparent" },
    ];
    return {
      drawerOpen: d !== null,
      drawerSide: d === "files" ? "right" : "left",
      drawerTitle: d === "files" ? "文件" : "会话",
      drawerRows: d === "files" ? files : sessions,
      openSessions: () => this.setState({ drawer: "sessions" }),
      openFiles: () => this.setState({ drawer: "files" }),
      close: () => this.setState({ drawer: null }),
    };
  }
}
</script>
</body>
</html>

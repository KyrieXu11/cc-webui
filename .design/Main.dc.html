<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5b6bff; } a:hover { color: #6e7cff; }
    * { box-sizing: border-box; }
    .sb::-webkit-scrollbar { width: 0; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0a0d14; color: #e8eaed; font-family: 'IBM Plex Sans', -apple-system, 'PingFang SC', sans-serif; font-size: 14px; overflow: hidden;">

  <!-- 顶栏：桌面 h-14 原样保留，只是把搜索和 provider chip 收进右侧 ⋯ -->
  <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.06);">
    <div style="width: 8px; height: 8px; border-radius: 999px; background: #5b6bff; flex-shrink: 0;"></div>
    <div style="display: flex; flex-direction: column; min-width: 0; flex-grow: 1;">
      <div style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">cc-webui</div>
      <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6b7079; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">~/code/cc-webui · 35ca51aa</div>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #a0a4ad; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><path d="M9 3V15M3 9H15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
    <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #a0a4ad; flex-shrink: 0;">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="4" cy="9" r="1.4" fill="currentColor"/><circle cx="9" cy="9" r="1.4" fill="currentColor"/><circle cx="14" cy="9" r="1.4" fill="currentColor"/></svg>
    </div>
  </div>

  <!-- 内容区：底部 tab 切换 -->
  <div class="sb" style="flex-grow: 1; overflow: hidden; position: relative;">

    <sc-if value="{{ showChat }}" hint-placeholder-val="{{ true }}">
      <div style="height: 100%; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 18px;">
        <div style="align-self: flex-end; max-width: 84%; background: #191e2a; border: 1px solid rgba(255,255,255,0.12); border-radius: 14px; padding: 10px 14px; font-size: 14.5px; line-height: 1.6;">把 scan 改成只遍历白名单里的目录</div>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="font-size: 14.5px; line-height: 1.65; color: #e8eaed;">先看现在的实现——它是走完整个 <span style="font-family:'IBM Plex Mono',monospace; font-size:13px; color:#ef9d5a;">$HOME</span> 再过滤。</div>

          <!-- 工具时间线：桌面同款，行高抬到 44 -->
          <div style="border: 1px solid rgba(255,255,255,0.06); border-radius: 10px; overflow: hidden;">
            <div style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; background: #121620;">
              <div style="width: 6px; height: 6px; border-radius: 999px; background: #3ecf8e; flex-shrink: 0;"></div>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a0a4ad;">Read</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #6b7079; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1;">server/fs.ts</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7079;">0.2s</span>
            </div>
            <div style="height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px; border-top: 1px solid rgba(255,255,255,0.06);">
              <div style="width: 6px; height: 6px; border-radius: 999px; background: #e0a030; flex-shrink: 0;"></div>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a0a4ad;">Bash</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #6b7079; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1;">npm test</span>
              <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7079;">运行中</span>
            </div>
          </div>

          <!-- 提问卡：窄屏下选项一行一个，命中 48px -->
          <div style="border: 1px solid rgba(91,107,255,0.25); background: #121620; border-radius: 12px; padding: 14px;">
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.1em; color: #5b6bff; margin-bottom: 10px;">请选择</div>
            <div style="font-size: 13.5px; line-height: 1.55; margin-bottom: 10px;">只遍历白名单根，还是保留全量扫描？</div>
            <div style="display: flex; flex-direction: column; gap: 8px;">
              <div style="min-height: 48px; display: flex; align-items: center; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(91,107,255,0.5); background: rgba(91,107,255,0.12); font-size: 13px;">只遍历白名单根</div>
              <div style="min-height: 48px; display: flex; align-items: center; padding: 8px 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); color: #a0a4ad; font-size: 13px;">保留全量扫描</div>
            </div>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ showFiles }}" hint-placeholder-val="{{ false }}">
      <div style="height: 100%; overflow-y: auto;">
        <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.06); font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #6b7079;">~/code/cc-webui / server</div>
        <sc-for list="{{ files }}" as="f" hint-placeholder-count="7">
          <div style="min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-bottom: 1px solid rgba(255,255,255,0.06);">
            <span style="color: {{ f.color }}; flex-shrink: 0; display: flex;">
              <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="{{ f.icon }}" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #e8eaed; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ f.name }}</span>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{ showTasks }}" hint-placeholder-val="{{ false }}">
      <div style="height: 100%; overflow-y: auto; padding: 14px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="2">
            <div style="border: 1px solid rgba(255,255,255,0.06); background: #121620; border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px;">
              <div style="display: flex; align-items: center; gap: 8px;">
                <div style="width: 6px; height: 6px; border-radius: 999px; background: {{ t.color }};"></div>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex-grow: 1;">{{ t.cmd }}</span>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7079;">{{ t.status }}</span>
              </div>
              <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7079; line-height: 1.5; white-space: pre-line;">{{ t.tail }}</div>
              <div style="display: flex; gap: 8px;">
                <div style="height: 44px; flex-grow: 1; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 12.5px; color: #a0a4ad;">查看输出</div>
                <div style="height: 44px; flex-grow: 1; display: flex; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; font-size: 12.5px; color: #e05252;">终止</div>
              </div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
  </div>

  <!-- Composer：贴在 tab 栏上方 -->
  <sc-if value="{{ showChat }}" hint-placeholder-val="{{ true }}">
    <div style="flex-shrink: 0; padding: 8px 12px 10px;">
      <div style="background: #191e2a; border: 1px solid rgba(255,255,255,0.12); border-radius: 16px;">
        <div style="padding: 12px 14px 6px; font-size: 14.5px; line-height: 1.6; color: #6b7079;">问点什么…</div>
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 8px 8px;">
          <div style="display: flex; gap: 2px;">
            <div style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #a0a4ad;">
              <svg width="17" height="17" viewBox="0 0 18 18" fill="none"><path d="M12.5 8.5L9 12a2.5 2.5 0 0 1-3.5-3.5l4-4a1.7 1.7 0 0 1 2.4 2.4L8 10.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </div>
            <div style="height: 44px; display: flex; align-items: center; padding: 0 10px; font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #6b7079;">opus · auto</div>
          </div>
          <div style="width: 44px; height: 44px; border-radius: 999px; background: #5b6bff; display: flex; align-items: center; justify-content: center;">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5L8 3l4.5 4.5" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>
    </div>
  </sc-if>

  <!-- 底部 tab：44px 命中 + 20px 安全区 -->
  <div style="flex-shrink: 0; display: flex; border-top: 1px solid rgba(255,255,255,0.06); background: #121620; padding-bottom: 20px;">
    <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
      <div onClick="{{ tab.pick }}" style="flex-grow: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{ tab.color }}; cursor: pointer;">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="{{ tab.icon }}" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size: 10.5px; letter-spacing: 0.02em;">{{ tab.label }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: "chat" };
  }
  renderVals() {
    const t = this.state.tab;
    const mk = (id, label, icon) => ({
      id, label, icon,
      color: t === id ? "#5b6bff" : "#6b7079",
      pick: () => this.setState({ tab: id }),
    });
    return {
      showChat: t === "chat",
      showFiles: t === "files",
      showTasks: t === "tasks",
      tabs: [
        mk("chat", "对话", "M3 5.5h14v8.5H8.5L5 17v-3H3z"),
        mk("files", "文件", "M3 5.5A1.5 1.5 0 0 1 4.5 4h3l1.5 2h6.5A1.5 1.5 0 0 1 17 7.5v7A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5z"),
        mk("tasks", "任务", "M4 6h12M4 10h12M4 14h7"),
        mk("more", "更多", "M4 10h.01M10 10h.01M16 10h.01"),
      ],
      files: [
        { name: "auth/", color: "#ef9d5a", icon: "M2 4.5A1.5 1.5 0 0 1 3.5 3h2.7l1.3 1.8h5A1.5 1.5 0 0 1 14 6.3v5.2A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5z" },
        { name: "executors/", color: "#ef9d5a", icon: "M2 4.5A1.5 1.5 0 0 1 3.5 3h2.7l1.3 1.8h5A1.5 1.5 0 0 1 14 6.3v5.2A1.5 1.5 0 0 1 12.5 13h-9A1.5 1.5 0 0 1 2 11.5z" },
        { name: "chat.ts", color: "#6b7079", icon: "M4 2h5l3 3v9H4z" },
        { name: "fs.ts", color: "#6b7079", icon: "M4 2h5l3 3v9H4z" },
        { name: "index.ts", color: "#6b7079", icon: "M4 2h5l3 3v9H4z" },
        { name: "permission.ts", color: "#6b7079", icon: "M4 2h5l3 3v9H4z" },
        { name: "mcp-bash-route.ts", color: "#6b7079", icon: "M4 2h5l3 3v9H4z" },
      ],
      tasks: [
        { cmd: "npm test", status: "运行中", color: "#e0a030", tail: "ℹ tests 17\nℹ pass 16", },
        { cmd: "npm run build", status: "已完成", color: "#3ecf8e", tail: "✓ built in 551ms" },
      ],
    };
  }
}
</script>
</body>
</html>

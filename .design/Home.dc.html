<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #5b6bff; } a:hover { color: #6e7cff; }
    * { box-sizing: border-box; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #0a0d14; color: #e8eaed; font-family: 'IBM Plex Sans', -apple-system, 'PingFang SC', sans-serif; overflow: hidden;">

  <div style="flex-grow: 1; overflow-y: auto; padding: 40px 20px 20px;">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.02em;">Web Code</div>
    <div style="display: flex; align-items: center; gap: 8px; margin: 8px 0 28px;">
      <div style="width: 6px; height: 6px; border-radius: 999px; background: #3ecf8e;"></div>
      <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #a0a4ad;">cc-webui.freeaitech.top:8443</span>
    </div>

    <!-- 桌面这里是 ProviderPicker + 最近项目标题，一行放不下就拆两行 -->
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <div style="font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;">最近项目</div>
      <div style="height: 44px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.12); background: #121620;">
        <div style="width: 6px; height: 6px; border-radius: 999px; background: #ef9d5a;"></div>
        <span style="font-size: 12.5px;">Claude</span>
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 4.5L6 7.5L9 4.5" stroke="#6b7079" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{ projects }}" as="p" hint-placeholder-count="4">
        <div style="border: 1px solid rgba(255,255,255,0.06); background: #121620; border-radius: 12px; padding: 14px;">
          <div style="display: flex; align-items: baseline; gap: 8px;">
            <div style="font-size: 14px; font-weight: 600; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ p.name }}</div>
            <div style="font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #6b7079; margin-left: auto; flex-shrink: 0;">{{ p.ago }}</div>
          </div>
          <div style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #6b7079; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ p.path }}</div>
          <div style="display: flex; flex-direction: column; gap: 2px; margin-top: 10px;">
            <sc-for list="{{ p.sessions }}" as="s" hint-placeholder-count="2">
              <div style="min-height: 44px; display: flex; align-items: center; gap: 10px; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 2px;">
                <div style="width: 5px; height: 5px; border-radius: 999px; background: {{ s.dot }}; flex-shrink: 0;"></div>
                <span style="font-size: 13px; color: #a0a4ad; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{ s.title }}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="flex-shrink: 0; padding: 10px 16px 12px; border-top: 1px solid rgba(255,255,255,0.06);">
    <div style="height: 48px; border-radius: 12px; background: #5b6bff; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px; font-weight: 500; color: #fff;">
      <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M8 3v10M3 8h10" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>
      打开项目
    </div>
  </div>

  <div style="flex-shrink: 0; display: flex; border-top: 1px solid rgba(255,255,255,0.06); background: #121620; padding-bottom: 20px;">
    <sc-for list="{{ tabs }}" as="tab" hint-placeholder-count="4">
      <div style="flex-grow: 1; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: {{ tab.color }};">
        <svg width="19" height="19" viewBox="0 0 20 20" fill="none"><path d="{{ tab.icon }}" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span style="font-size: 10.5px;">{{ tab.label }}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() {
    return {
      projects: [
        { name: "cc-webui", path: "~/code/cc-webui", ago: "刚刚", sessions: [

          { title: "AskUserQuestion 渲染修复", dot: "#6b7079" },
        ] },
        { name: "rebecca", path: "~/.cc-webui/workspaces/rebecca", ago: "2 小时前", sessions: [
          { title: "你好，你是谁？", dot: "#6b7079" },
        ] },
        { name: "quant", path: "~/code/python/quant", ago: "昨天", sessions: [
          { title: "回测脚本重构", dot: "#6b7079" },
          { title: "因子相关性", dot: "#6b7079" },
        ] },
      ],
      tabs: [
        { label: "对话", color: "#5b6bff", icon: "M3 5.5h14v8.5H8.5L5 17v-3H3z" },
        { label: "文件", color: "#6b7079", icon: "M3 5.5A1.5 1.5 0 0 1 4.5 4h3l1.5 2h6.5A1.5 1.5 0 0 1 17 7.5v7A1.5 1.5 0 0 1 15.5 16h-11A1.5 1.5 0 0 1 3 14.5z" },
        { label: "任务", color: "#6b7079", icon: "M4 6h12M4 10h12M4 14h7" },
        { label: "更多", color: "#6b7079", icon: "M4 10h.01M10 10h.01M16 10h.01" },
      ],
    };
  }
}
</script>
</body>
</html>
